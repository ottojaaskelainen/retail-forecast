bundle:
  name: retail-forecast

variables:
  sql_warehouse_id:
    description: SQL Warehouse ID
  genie_space_id:
    description: Default Genie Space ID
  genie_space_name:
    description: Genie Space display name

resources:
  apps:
    app:
      name: "retail-forecast"
      description: "Retail demand forecasting app with risk dashboard and Genie Q&A"
      source_code_path: ./
      user_api_scopes:
        - dashboards.genie

      # The resources which this app has access to.
      resources:
        - name: sql-warehouse
          sql_warehouse:
            id: ${var.sql_warehouse_id}
            permission: CAN_USE
        - name: genie-space
          genie_space:
            name: ${var.genie_space_name}
            space_id: ${var.genie_space_id}
            permission: CAN_RUN

targets:
  default:
    default: true
    workspace:
      host: https://adb-7405608574488109.9.azuredatabricks.net

    variables:
      sql_warehouse_id: b519c6909e98cb0c
      genie_space_id: 01f174bce41c1a95948377c20b19985b
      genie_space_name: Retail Demand Forecast Assistant

bundle:
  name: retail-forecast-poc
  engine: direct

workspace:
  host: https://adb-7405608574488109.9.azuredatabricks.net

include:
  - resources/catalog.yml
  - resources/pipeline.yml
  - resources/job.yml
  # Uncomment after pipeline has run and gold tables exist:
  - resources/genie.yml
  - resources/dashboard.yml
  - resources/app.yml

variables:
  warehouse_id:
    description: SQL warehouse used for dashboard and app queries
    default: "b519c6909e98cb0c"
  catalog:
    description: Unity Catalog catalog name — one catalog per environment
    default: "gdai_test_dev"

targets:
  dev:
    default: true

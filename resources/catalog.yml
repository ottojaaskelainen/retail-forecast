resources:
  catalogs:
    main_catalog:
      name: ${var.catalog}
      comment: "Retail forecast POC catalog — one catalog per environment"
      storage_root: abfss://fevm-default-container@stojsvt6mzuc.dfs.core.windows.net/retail_forecast

  schemas:
    landing_schema:
      catalog_name: ${resources.catalogs.main_catalog.name}
      name: landing
      comment: "Raw ingestion layer — volumes for POS and promo data"
    bronze_schema:
      catalog_name: ${resources.catalogs.main_catalog.name}
      name: bronze
      comment: "Bronze layer — raw ingested tables from Auto Loader"
    silver_schema:
      catalog_name: ${resources.catalogs.main_catalog.name}
      name: silver
      comment: "Silver layer — cleaned and deduplicated tables"
    gold_schema:
      catalog_name: ${resources.catalogs.main_catalog.name}
      name: gold
      comment: "Gold layer — aggregated views and forecast results"
    feature_schema:
      catalog_name: ${resources.catalogs.main_catalog.name}
      name: feature
      comment: "Feature Store — UC feature tables for demand forecasting"

  volumes:
    raw_pos_data:
      catalog_name: ${resources.catalogs.main_catalog.name}
      schema_name: ${resources.schemas.landing_schema.name}
      name: raw_pos_data
      volume_type: MANAGED
    raw_promo_data:
      catalog_name: ${resources.catalogs.main_catalog.name}
      schema_name: ${resources.schemas.landing_schema.name}
      name: raw_promo_data
      volume_type: MANAGED

resources:
  apps:
    retail_forecast_app:
      name: retail-forecast
      description: "Retail demand forecasting demo app"
      source_code_path: ../retail-forecast
      user_api_scopes:
        - genie
        - dashboards.genie
        - sql
      resources:
        - name: sql-warehouse
          sql_warehouse:
            id: ${resources.sql_warehouses.retail_forecast_wh.id}
            permission: CAN_USE
        - name: genie-space
          genie_space:
            name: Retail Demand Forecast Assistant
            space_id: ${resources.genie_spaces.retail_forecast_genie.id}
            permission: CAN_RUN

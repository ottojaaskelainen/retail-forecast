resources:
  jobs:
    retail_forecast_job:
      name: retail-forecast-job
      environments:
        - environment_key: default
          spec:
            client: "5"
            dependencies:
              - "databricks-feature-engineering>=0.16.0"
              - "scikit-learn"
      tasks:
        - task_key: generate_pos_data
          notebook_task:
            notebook_path: ${workspace.file_path}/notebooks/generate_pos_data
            base_parameters:
              catalog: ${var.catalog}
          environment_key: default

        - task_key: generate_promo_data
          notebook_task:
            notebook_path: ${workspace.file_path}/notebooks/generate_promo_data
            base_parameters:
              catalog: ${var.catalog}
          environment_key: default

        - task_key: run_pipeline
          pipeline_task:
            pipeline_id: ${resources.pipelines.retail_forecast_pipeline.id}
          depends_on:
            - task_key: generate_pos_data
            - task_key: generate_promo_data

        - task_key: build_features
          notebook_task:
            notebook_path: ${workspace.file_path}/training/build_features
            base_parameters:
              catalog: ${var.catalog}
          environment_key: default
          depends_on:
            - task_key: run_pipeline

        - task_key: train_model
          notebook_task:
            notebook_path: ${workspace.file_path}/training/train_model
            base_parameters:
              catalog: ${var.catalog}
          environment_key: default
          depends_on:
            - task_key: build_features

        - task_key: score_forecast
          notebook_task:
            notebook_path: ${workspace.file_path}/training/score_forecast
            base_parameters:
              catalog: ${var.catalog}
          environment_key: default
          depends_on:
            - task_key: train_model

        - task_key: apply_uc_tags
          notebook_task:
            notebook_path: ${workspace.file_path}/notebooks/apply_uc_tags
            base_parameters:
              catalog: ${var.catalog}
          environment_key: default
          depends_on:
            - task_key: score_forecast
